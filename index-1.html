<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08140f"><title>BahiKhata</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#08140f;--c1:#0f221b;--c2:#16312a;--line:#23423a;--ink:#e9f6f1;--mu:#8fb0a5;--ac:#34d399;--ac2:#10b981;--gold:#f4c95d;--bad:#fb7185;--h:'Sora',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--b);-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(800px 400px at 80% -10%,#12392d,transparent),var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s,opacity .2s}button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 150px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--h);margin:0}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.head h1{font-size:21px}.head small{color:var(--mu)}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--c2);color:var(--ac)}
.chip.g{color:var(--gold)}.chip.r{color:var(--bad)}
.hero{background:linear-gradient(135deg,#10b981,#0a6b52);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 14px 34px rgba(16,185,129,.22);color:#04150f}
.hero small{opacity:.8}.hero .big{font-family:var(--h);font-size:36px;font-weight:700;margin:2px 0 12px}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid rgba(0,0,0,.2);padding-top:10px}
.trio span{display:block;font-size:12.5px;opacity:.8}.trio b{font-size:17px}
.card{background:var(--c1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}.mu{color:var(--mu);font-size:13.5px}
.banner{border-radius:14px;padding:11px 14px;margin-bottom:12px;font-size:14px;background:#3a2f12;color:var(--gold)}
.banner.r{background:#3a1620;color:var(--bad)}
.search,.in{width:100%;background:var(--c1);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:13px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.tile.on{border-color:var(--ac);background:var(--c2)}.tile.out{opacity:.45}
.tile b{font-weight:600}.tile .p{font-family:var(--h);font-weight:700;color:var(--ac)}
.badge{position:absolute;top:-7px;right:-7px;background:var(--ac);color:#04150f;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:13px;padding:0 7px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--c1);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.row.low{border-color:#5a2733}.row b{display:block}.row .q{font-family:var(--h);font-weight:700;font-size:22px;text-align:right}.row .q small{display:block;font-family:var(--b);font-weight:400;font-size:12px;color:var(--mu)}
.low .q{color:var(--bad)}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:600;background:var(--c2);width:100%}
.btn.p{background:linear-gradient(135deg,#34d399,#10b981);color:#04150f}.btn.d{background:none;color:var(--bad);border:1px solid #5a2733}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,20,15,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:11px 0;font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac)}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab,.cbar{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:16px;padding:14px 20px;font-weight:600;background:linear-gradient(135deg,#34d399,#10b981);color:#04150f;box-shadow:0 10px 26px rgba(16,185,129,.35)}
.cbar{left:16px;display:flex;justify-content:space-between;align-items:center}
#sheet{position:fixed;inset:0;display:none;z-index:20}#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--c1);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;animation:in .2s ease;border:1px solid var(--line)}
.panel h2{font-size:20px;margin-bottom:12px}.lbl{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gap>*+*{margin-top:10px}
.ln{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px}
.step{display:flex;align-items:center;gap:6px}.step button{width:36px;height:36px;border-radius:10px;border:0;background:var(--c2);font-size:18px}.step input{width:56px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;height:36px}
.tot{display:flex;justify-content:space-between;font-family:var(--h);font-size:22px;font-weight:700;padding:12px 0}
.auth{max-width:420px;margin:0 auto;padding:44px 20px;animation:in .4s ease}
.logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#34d399,#0a6b52);display:grid;place-items:center;font:700 30px var(--h);color:#04150f;margin:0 auto 14px}
.splash{min-height:100vh;display:grid;place-items:center}.splash .logo{animation:pulse 1.2s infinite alternate}@keyframes pulse{to{transform:scale(1.12);opacity:.7}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--c1);border-radius:14px;padding:3px;margin:18px 0 14px}
.seg button{border:0;background:none;padding:11px;border-radius:11px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--c2);color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#e9f6f1;color:#08140f;padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:40;display:none;max-width:90%;text-align:center}
</style></head><body>
<div id="app"></div>
<div id="sheet"><div class="scrim" data-a="x"></div><div class="panel" id="panel"></div></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://wrhkllpsavogoqorhfnl.supabase.co',SB_KEY='sb_publishable_1LEtAmSil5YSv7rtB8JUEw_ke1JSerD';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:2}),rs=n=>'Rs '+fmt(n);
const CATS=['Grocery','Rice & Flour','Oil & Ghee','Tea & Drinks','Spices','Dairy','Snacks','Cleaning & Soap','Other'],UNITS=['pcs','kg','packet','carton','dozen','litre','bag'];
const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',sell:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l2-8H6"/>',stock:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
let st={loading:true,user:null,shop:null,items:[],sales:[],tab:'home',cart:[],q:'',mode:'login'},tt;
const low=i=>+i.stock<=+i.min_stock,item=id=>st.items.find(i=>i.id===id);
const live=()=>st.shop&&st.shop.status==='active'&&new Date(st.shop.valid_until)>new Date();
const days=()=>Math.max(0,Math.ceil((new Date(st.shop.valid_until)-new Date())/864e5));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
function sheet(h){$('panel').innerHTML=h;$('sheet').classList.add('open')}function closeSheet(){$('sheet').classList.remove('open')}
async function load(){
  const {data:shop}=await sb.from('shops').select('*').eq('owner_id',st.user.id).maybeSingle();
  st.shop=shop;st.loading=false;
  if(shop){const t=new Date();t.setHours(0,0,0,0);
    const [i,s]=await Promise.all([sb.from('items').select('*').order('name'),sb.from('sales').select('*').gte('created_at',t.toISOString())]);
    st.items=i.data||[];st.sales=s.data||[];}
  render();
}
function authV(){const l=st.mode==='login';return `<div class="auth"><div class="logo">B</div><h1 style="text-align:center">BahiKhata</h1><p class="mu" style="text-align:center">Smart stock and sales for your kiryana store</p>
<div class="seg"><button data-a="mode" data-v="login" class="${l?'on':''}">Log in</button><button data-a="mode" data-v="signup" class="${l?'':'on'}">Sign up</button></div>
<label class="lbl">Email</label><input class="in" id="em" type="email" autocomplete="email"><label class="lbl">Password</label><input class="in" id="pw" type="password" autocomplete="${l?'current-password':'new-password'}" placeholder="At least 6 characters">
<button class="btn p" data-a="auth">${l?'Log in':'Create account'}</button>${l?'':'<p class="mu" style="text-align:center">New shops get a 14 day free trial.</p>'}</div>`}
function setupV(){return `<div class="auth"><div class="logo">B</div><h1 style="text-align:center">Set up your shop</h1><p class="mu" style="text-align:center">You can change this later</p><div style="height:14px"></div>
<label class="lbl">Shop name</label><input class="in" id="sn" placeholder="e.g. Kashif Ali Traders"><label class="lbl">Phone (optional)</label><input class="in" id="sp" type="tel">
<button class="btn p" data-a="mkshop">Start my free trial</button><button class="btn" style="margin-top:10px" data-a="out">Log out</button></div>`}
function head(){const s=st.shop,c=!live()?'<span class="chip r">Plan ended</span>':s.plan==='trial'?`<span class="chip g">Trial: ${days()} days left</span>`:'<span class="chip">Active</span>';
  return `<div class="head"><div><h1>${esc(s.name)}</h1><small>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</small></div>${c}</div>`}
function banner(){return live()?'':'<div class="banner r">Your plan has ended or was paused. You can view your data, but selling and stock changes are blocked. Contact support to renew.</div>'}
function homeV(){const t=st.sales.reduce((a,s)=>a+ +s.total,0),p=st.sales.reduce((a,s)=>a+ +s.profit,0),d=st.sales.reduce((a,s)=>a+ +s.due,0),L=st.items.filter(low);
  const val=st.items.reduce((a,i)=>a+Math.max(+i.stock,0)*+i.cost,0);
  return `<div class="hero"><small>Sales today</small><div class="big">${rs(t)}</div><div class="trio"><div><span>Profit</span><b>${rs(p)}</b></div><div><span>Bills</span><b>${st.sales.length}</b></div></div></div>
<div class="card"><h3>Stock value</h3><div class="big" style="font:700 24px var(--h)">${rs(val)}</div><span class="mu">${st.items.length} items in your store</span></div>
<div class="card"><h3>Low stock (${L.length})</h3>${L.length?L.slice(0,6).map(i=>`<div class="ln"><span>${esc(i.name)}</span><b style="color:var(--bad)">${fmt(i.stock)} ${esc(i.unit)}</b></div>`).join(''):'<span class="mu">Nothing is running low.</span>'}</div>
${st.items.length?'':'<button class="btn p" data-a="tab" data-v="stock">Add your first item</button>'}`}
function tiles(){const q=st.q.toLowerCase(),L=st.items.filter(i=>!q||i.name.toLowerCase().includes(q));
  if(!st.items.length)return '<div class="card mu">No items yet. Add items in the Stock tab first.</div>';
  return '<div class="grid">'+L.map(i=>{const c=(st.cart.find(l=>l.id===i.id)||{}).qty;return `<button class="tile${c?' on':''}${+i.stock<=0?' out':''}" data-a="add2" data-v="${i.id}">${c?`<span class="badge">${fmt(c)}</span>`:''}<b>${esc(i.name)}</b><span><span class="p">${rs(i.price)}</span> <span class="mu">/${esc(i.unit)}</span></span><span class="mu">${+i.stock<=0?'Out of stock':fmt(i.stock)+' left'}</span></button>`}).join('')+'</div>'}
function sellV(){return `<div class="head"><h1>New sale</h1></div><input class="search" id="q" value="${esc(st.q)}" placeholder="Search items" data-l="tiles"><div id="pl">${tiles()}</div>`}
function rows(){const q=st.q.toLowerCase(),L=st.items.filter(i=>!q||i.name.toLowerCase().includes(q));
  if(!L.length)return '<div class="card mu">No items yet. Tap Add item to start.</div>';
  return L.map(i=>`<button class="row${low(i)?' low':''}" data-a="item" data-v="${i.id}"><span><b>${esc(i.name)}</b><span class="mu">${esc(i.category)}, ${rs(i.price)}/${esc(i.unit)}</span></span><span class="q">${fmt(i.stock)}<small>${esc(i.unit)}${low(i)?' (low)':''}</small></span></button>`).join('')}
function stockV(){return `<div class="head"><h1>Stock</h1></div><input class="search" id="q" value="${esc(st.q)}" placeholder="Search items" data-l="rows"><div id="pl">${rows()}</div>`}
function meV(){return `<div class="head"><h1>Account</h1></div><div class="card"><h3>${esc(st.shop.name)}</h3><div class="ln"><span class="mu">Email</span><span>${esc(st.user.email)}</span></div><div class="ln"><span class="mu">Plan</span><b>${esc(st.shop.plan)}</b></div><div class="ln"><span class="mu">Valid until</span><b>${new Date(st.shop.valid_until).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</b></div></div><button class="btn d" data-a="out">Log out</button>`}
function nav(){return '<nav><div>'+[['home','Home'],['sell','Sell'],['stock','Stock'],['me','Account']].map(t=>`<button class="${st.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join('')+'</div></nav>'}
function sub(){return st.cart.reduce((a,l)=>a+ +l.qty*+(item(l.id)||{price:0}).price,0)}
function render(){const a=$('app');
  if(st.loading){a.innerHTML='<div class="splash"><div class="logo">B</div></div>';return}
  if(!st.user){a.innerHTML=authV();return}
  if(!st.shop){a.innerHTML=setupV();return}
  a.innerHTML='<div class="wrap">'+head()+banner()+({home:homeV,sell:sellV,stock:stockV,me:meV}[st.tab])()+'</div>'+nav()+
  (st.tab==='stock'?'<button class="fab" data-a="addform">+ Add item</button>':'')+
  (st.tab==='sell'&&st.cart.length?`<button class="cbar" data-a="co"><span>${st.cart.length} item${st.cart.length>1?'s':''}</span><b>${rs(sub())}</b><span>Review</span></button>`:'');
}
function addForm(){sheet(`<h2>Add item</h2><div class="gap"><div><label class="lbl">Item name</label><input class="in" id="fn" style="margin:0"></div>
<div class="two"><div><label class="lbl">Category</label><select class="in" id="fc" style="margin:0">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label class="lbl">Sold per</label><select class="in" id="fu" style="margin:0">${UNITS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
<div class="two"><div><label class="lbl">Buying price</label><input class="in" id="fb" type="number" inputmode="decimal" style="margin:0"></div><div><label class="lbl">Selling price</label><input class="in" id="fp" type="number" inputmode="decimal" style="margin:0"></div></div>
<div class="two"><div><label class="lbl">Stock now</label><input class="in" id="fs" type="number" inputmode="decimal" value="0" style="margin:0"></div><div><label class="lbl">Warn at</label><input class="in" id="fm" type="number" inputmode="decimal" value="5" style="margin:0"></div></div>
<button class="btn p" data-a="saveitem">Save item</button></div>`)}
async function saveItem(){
  if(!live())return toast('Your plan is not active');
  const n=$('fn').value.trim(),b=+$('fb').value,p=+$('fp').value,o=+$('fs').value||0;
  if(!n||!(b>=0)||!(p>=0)||$('fb').value===''||$('fp').value==='')return toast('Enter name, buying and selling price');
  const {data,error}=await sb.from('items').insert({shop_id:st.shop.id,name:n,category:$('fc').value,unit:$('fu').value,cost:b,price:p,min_stock:+$('fm').value||0}).select().single();
  if(error)return toast(error.message);
  if(o>0){const r=await sb.rpc('set_stock',{p_item:data.id,p_qty:o,p_note:'Opening stock'});if(r.error)toast(r.error.message)}
  closeSheet();await load();toast('Item added');
}
function itemSheet(id){const i=item(id);sheet(`<h2>${esc(i.name)}</h2><p class="mu">${fmt(i.stock)} ${esc(i.unit)} in stock. Buy ${rs(i.cost)}, sell ${rs(i.price)}.</p><div class="gap">
<div class="two"><div><label class="lbl">Received qty</label><input class="in" id="rq" type="number" inputmode="decimal" style="margin:0"></div><div><label class="lbl">Buying price</label><input class="in" id="rc" type="number" inputmode="decimal" value="${i.cost}" style="margin:0"></div></div>
<button class="btn p" data-a="recv" data-v="${id}">Receive stock</button>
<div><label class="lbl">Or set actual stock count</label><input class="in" id="cq" type="number" inputmode="decimal" value="${i.stock}" style="margin:0"></div>
<button class="btn" data-a="cnt" data-v="${id}">Save count</button></div>`)}
async function rpc(fn,args,msg){if(!live())return toast('Your plan is not active');const {error}=await sb.rpc(fn,args);if(error)return toast(error.message);closeSheet();await load();toast(msg)}
function checkout(){if(!st.cart.length)return closeSheet();
  sheet(`<h2>Review sale</h2>${st.cart.map(l=>{const i=item(l.id);return `<div class="ln"><span><b>${esc(i.name)}</b><br><span class="mu">${rs(i.price)}/${esc(i.unit)}</span></span><div class="step"><button data-a="dec" data-v="${l.id}">-</button><input type="number" inputmode="decimal" data-q="${l.id}" value="${l.qty}"><button data-a="inc" data-v="${l.id}">+</button></div></div>`}).join('')}
<label class="lbl" style="margin-top:12px">Discount (Rs)</label><input class="in" id="disc" type="number" inputmode="decimal" placeholder="0"><div class="tot"><span>Total</span><span id="tot">${rs(sub())}</span></div>
<button class="btn p" data-a="sale">Complete sale (cash)</button><button class="btn d" style="margin-top:10px" data-a="clr">Clear cart</button>`)}
async function sale(){
  const d=Math.min(Math.max(+$('disc').value||0,0),sub());
  for(const l of st.cart){const i=item(l.id);if(!(+l.qty>0))return toast('Check the quantity for '+i.name);if(+l.qty>+i.stock)return toast('Only '+fmt(i.stock)+' '+i.unit+' of '+i.name+' in stock')}
  await rpc('create_sale',{p_shop:st.shop.id,p_party:null,p_discount:d,p_paid:null,p_lines:st.cart.map(l=>({item_id:l.id,qty:+l.qty,price:+item(l.id).price}))},'Sale completed');
  if(!$('sheet').classList.contains('open'))st.cart=[],render();
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='x')closeSheet();
  else if(a==='mode'){st.mode=v;render()}
  else if(a==='auth'){const em=$('em').value.trim(),pw=$('pw').value;if(!em||pw.length<6)return toast('Enter email and a password of 6+ characters');
    el.disabled=true;const r=st.mode==='login'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw});el.disabled=false;
    if(r.error)return toast(r.error.message);if(!r.data.session)toast('Check your email to confirm your account')}
  else if(a==='mkshop'){const n=$('sn').value.trim();if(!n)return toast('Enter your shop name');
    const {error}=await sb.from('shops').insert({name:n,phone:$('sp').value.trim()||null});if(error)return toast(error.message);await load()}
  else if(a==='out'){await sb.auth.signOut()}
  else if(a==='tab'){st.tab=v;st.q='';render();window.scrollTo(0,0)}
  else if(a==='addform')addForm();else if(a==='saveitem')saveItem();else if(a==='item')itemSheet(v);
  else if(a==='recv'){const q=+$('rq').value;if(!(q>0))return toast('Enter the quantity received');rpc('receive_stock',{p_shop:st.shop.id,p_item:v,p_qty:q,p_cost:+$('rc').value||0,p_supplier:null,p_paid:null},'Stock received')}
  else if(a==='cnt'){const q=+$('cq').value;if(!(q>=0)||$('cq').value==='')return toast('Enter the counted stock');rpc('set_stock',{p_item:v,p_qty:q,p_note:'Stock count'},'Stock updated')}
  else if(a==='add2'){const i=item(v),l=st.cart.find(x=>x.id===v);if(+i.stock<=0)return toast(i.name+' is out of stock');
    if(l){if(+l.qty+1>+i.stock)return toast('Only '+fmt(i.stock)+' '+i.unit+' in stock');l.qty=+l.qty+1}else st.cart.push({id:v,qty:1});render()}
  else if(a==='co')checkout();
  else if(a==='inc'){const l=st.cart.find(x=>x.id===v);if(+l.qty+1>+item(v).stock)toast('Not enough stock');else l.qty=+l.qty+1;checkout();render()}
  else if(a==='dec'){const l=st.cart.find(x=>x.id===v);l.qty=+l.qty-1;if(l.qty<=0)st.cart=st.cart.filter(x=>x.id!==v);checkout();render()}
  else if(a==='clr'){st.cart=[];closeSheet();render()}
  else if(a==='sale')sale();
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.l){st.q=t.value;$('pl').innerHTML=t.dataset.l==='tiles'?tiles():rows()}
  else if(t.dataset.q){const l=st.cart.find(x=>x.id===t.dataset.q);if(l){l.qty=t.value;$('tot')&&($('tot').textContent=rs(sub()))}}
});
sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='TOKEN_REFRESHED')return;
  if(ev==='SIGNED_IN'&&st.shop&&s&&st.user&&st.user.id===s.user.id)return;
  st.user=s?s.user:null;
  setTimeout(async()=>{if(st.user)await load();else{st.shop=null;st.items=[];st.sales=[];st.cart=[];st.loading=false;render()}},0);
});
render();
</script></body></html>
